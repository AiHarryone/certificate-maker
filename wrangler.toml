# Certificate Maker unlock backend — Cloudflare Worker config
# Deploy:  npx wrangler deploy
name = "certificate-maker-unlock"
main = "worker-cf.js"
compatibility_date = "2024-11-01"

[observability]
enabled = true

# Secrets are set separately (never committed):
#   npx wrangler secret put CREEM_API_KEY
#   npx wrangler secret put CREEM_WEBHOOK_SECRET   (optional)
#   npx wrangler secret put FALLBACK_TOKEN_SECRET  (optional)
